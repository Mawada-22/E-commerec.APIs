server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The production Angular build uses a RELATIVE apiUrl ('api/'), so the browser
    # calls this same origin and nginx forwards to the API container. Same-origin
    # means no CORS involved at all.
    # The trailing slash on proxy_pass strips the /api prefix, because the API's
    # own routes are /products, /basket, /orders... with no prefix.
    location /api/ {
        proxy_pass         http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Angular is a single-page app: the router owns /shop, /orders, /checkout...
    # Without this fallback, reloading any deep link returns a 404 from nginx
    # before Angular ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
