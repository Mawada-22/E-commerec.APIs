<div class="container mt-5 text-center">
    <div><i class="fa fa-check-circle fa-4x mk-icon"></i></div>
    <h2 class="mt-3">Thank you! Your order is confirmed 💜</h2>
    <p class="mb-4 text-muted">We're getting your food ready — you can follow it from your orders.</p>

    <div class="d-flex justify-content-center gap-2">
        <a routerLink="/orders" class="btn btn-primary px-4 mr-2">View my orders</a>
        <!-- Only offer the single-order link when we actually got a real id back;
             linking to /orders/undefined used to 404 straight into Not Found. -->
        <a *ngIf="order?.id" routerLink="/orders/{{order.id}}" class="btn btn-outline-primary px-4">
            View this order
        </a>
        <a routerLink="/shop" class="btn btn-outline-secondary px-4 ml-2">Keep shopping</a>
    </div>
</div>
