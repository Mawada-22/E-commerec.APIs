<div class="d-flex justify-content-center mt-5 pt-5">
    <div class="col-4">

        <div class="text-center mb-4">
            <h1 class="h3 mb-2 font-weight-normal">Forgot your password?</h1>
            <p class="text-muted small" *ngIf="step === 1">No worries — enter your email and we'll get you a reset code.</p>
            <p class="text-muted small" *ngIf="step === 2">Now choose your new password 💜</p>
        </div>

        <ul class="text-danger small" *ngIf="errors.length">
            <li *ngFor="let error of errors">{{error}}</li>
        </ul>

        <form *ngIf="step === 1" [formGroup]="emailForm" (ngSubmit)="requestToken()">
            <app-text-input formControlName="email" [label]="'Email address'"></app-text-input>
            <button [disabled]="emailForm.invalid" class="btn btn-primary btn-block" type="submit">
                Send me a reset code
            </button>
        </form>

        <form *ngIf="step === 2" [formGroup]="resetForm" (ngSubmit)="resetPassword()">
            <app-text-input formControlName="newPassword" [label]="'New password'" [type]="'password'"></app-text-input>
            <button [disabled]="resetForm.invalid" class="btn btn-primary btn-block" type="submit">
                Change my password
            </button>
        </form>

        <div class="text-center mt-3">
            <a routerLink="/account/login" class="small">Back to login</a>
        </div>
    </div>
</div>
